{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Attendance{% endblock %} · {{ site_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
<link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/favicon-180.png' %}">
<meta name="theme-color" content="#12314E">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<input type="checkbox" id="railtoggle" hidden>
<div class="shell">
  {% include "partials/_rail.html" %}
  <div class="main">
    <div class="topbar">
      <label for="railtoggle" class="btn sm rail-toggle">Menu</label>
      <div>
        <div class="eyebrow">{% block eyebrow %}{{ site_name }}{% endblock %}</div>
        <h1>{% block heading %}{% endblock %}</h1>
      </div>
      <div class="clock">
        <div class="eyebrow">Today</div>
        <div class="mono small">{% now "D, d M Y" %}</div>
      </div>
    </div>
    <div class="content">
      {% include "partials/_messages.html" %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
